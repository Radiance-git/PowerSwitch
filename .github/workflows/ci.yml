name: CI

on:
push:
pull_request:

jobs:
test:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y shellcheck power-profiles-daemon

  - name: Run tests
    run: ./tests/test.sh
```
